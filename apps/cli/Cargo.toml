[package]
name = "takokit-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "takokit-server"
path = "src/main.rs"

[[bin]]
name = "tako"
path = "src/bin/tako.rs"

[[bin]]
name = "Takokit"
path = "src/bin/takokit-app.rs"

[[bin]]
name = "takokit-updater"
path = "src/bin/takokit-updater.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
crossterm.workspace = true
fs2.workspace = true
flate2.workspace = true
libc.workspace = true
open.workspace = true
percent-encoding.workspace = true
ratatui.workspace = true
serde = { workspace = true }
takokit-core = { path = "../../crates/takokit-core" }
takokit-audio = { path = "../../crates/takokit-audio" }
takokit-models = { path = "../../crates/takokit-models" }
takokit-package = { path = "../../crates/takokit-package" }
takokit-release = { path = "../../crates/takokit-release" }
takokit-server = { path = "../../crates/takokit-server" }
takokit-store = { path = "../../crates/takokit-store" }
tokio.workspace = true
tar.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
sha2.workspace = true
ureq.workspace = true
uuid.workspace = true
zip.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
serde_json.workspace = true

[build-dependencies]
winresource = "0.1.31"
