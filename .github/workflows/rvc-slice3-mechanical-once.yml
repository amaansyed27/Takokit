name: RVC Slice 3 mechanical fixes
on:
  push:
    branches: [slice/advanced-rvc-cloning]
    paths:
      - .github/workflows/rvc-slice3-mechanical-once.yml
      - .github/scripts/rvc-slice3-mechanical.py
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply compatibility fixes
        run: python .github/scripts/rvc-slice3-mechanical.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Commit fixes
        run: |
          git rm .github/workflows/rvc-slice3-mechanical-once.yml .github/scripts/rvc-slice3-mechanical.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(slice3): restore GUI compatibility and Rust formatting"
          git push origin HEAD:slice/advanced-rvc-cloning
