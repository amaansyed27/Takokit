name: RVC regression wire once
on:
  push:
    branches: [slice/advanced-rvc-cloning]
    paths:
      - .github/workflows/rvc-regression-wire-once.yml
      - .github/scripts/rvc-test-wire.py
permissions:
  contents: write
jobs:
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Wire and format regression tests
        run: |
          python .github/scripts/rvc-test-wire.py
          cargo fmt --all
      - name: Advanced RVC service and package tests
        run: cargo test -p takokit-models rvc_voice_service --lib
      - name: Advanced RVC API tests
        run: cargo test -p takokit-server rvc --lib
      - name: Advanced RVC CLI tests
        run: cargo test -p takokit-cli tests::rvc --lib
      - name: Advanced RVC TUI tests
        run: cargo test -p takokit-cli tui:: --lib
      - name: Repository quality
        run: python scripts/audit_file_sizes.py
      - name: Commit regression coverage
        run: |
          git rm .github/workflows/rvc-regression-wire-once.yml .github/scripts/rvc-test-wire.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(slice3): complete RVC API CLI TUI regression coverage"
          git push origin HEAD:slice/advanced-rvc-cloning
