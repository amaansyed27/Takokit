name: Slice 3 repair and final validation once

on:
  push:
    branches: [slice/advanced-rvc-cloning]
    paths:
      - .github/workflows/slice3-repair-finalize-once.yml

permissions:
  contents: write

jobs:
  repair-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Restore Slice 2 daemon and apply only intended cleanup
        shell: bash
        run: |
          set -euxo pipefail
          git checkout 147e85e28296f5e172ae5184dc390d5a3030b739 -- apps/cli/src/daemon.rs
          python - <<'PY'
          from pathlib import Path

          daemon = Path("apps/cli/src/daemon.rs")
          text = daemon.read_text(encoding="utf-8")
          old = '''use runtime::{
              canonical_exe, canonical_root, daemon_lock_is_held, log_path, managed_daemon_executable,
              port_is_occupied, preferred_daemon_executable, startup_lock, takokit_health_responds,
              verify_identity,
          };
          '''
          new = '''use runtime::{
              canonical_exe, canonical_root, daemon_lock_is_held, log_path, managed_daemon_executable,
              port_is_occupied, startup_lock, verify_identity,
          };
          #[cfg(test)]
          use runtime::{preferred_daemon_executable, takokit_health_responds};
          '''
          if old not in text:
              raise SystemExit("expected daemon import block not found after restore")
          daemon.write_text(text.replace(old, new, 1), encoding="utf-8")

          job = Path("apps/cli/src/tui/job.rs")
          text = job.read_text(encoding="utf-8")
          old = "    path::{Path, PathBuf},\n"
          new = "    path::PathBuf,\n"
          if old not in text:
              raise SystemExit("expected TUI Path import not found")
          job.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          cargo fmt --all

      - name: Remove one-time validation artifacts and create exact validation commit
        shell: bash
        run: |
          set -euxo pipefail
          git rm -f .github/workflows/slice3-final-validation-once.yml
          git rm -f .github/workflows/slice3-repair-finalize-once.yml
          test ! -e .github/workflows/rvc-regression-wire-once.yml
          test ! -e .github/scripts/rvc-test-wire.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/cli/src/daemon.rs apps/cli/src/tui/job.rs
          git commit -m "fix(slice3): restore daemon and finalize validation cleanup"
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git status --short

      - name: Formatting check
        run: cargo fmt --all -- --check

      - name: Workspace warnings as errors
        shell: bash
        run: RUSTFLAGS='-D warnings' cargo check --workspace

      - name: Daemon and build freshness regression tests
        shell: bash
        run: RUSTFLAGS='-D warnings' cargo test -p takokit-cli daemon --lib

      - name: Advanced RVC service and managed conversion tests
        shell: bash
        run: RUSTFLAGS='-D warnings' cargo test -p takokit-models rvc_voice_service --lib

      - name: Advanced RVC package signing and security tests
        shell: bash
        run: RUSTFLAGS='-D warnings' cargo test -p takokit-models rvc_voice_service::package_security_tests --lib

      - name: Advanced RVC API tests
        shell: bash
        run: RUSTFLAGS='-D warnings' cargo test -p takokit-server rvc --lib

      - name: Advanced RVC CLI lifecycle tests
        shell: bash
        run: RUSTFLAGS='-D warnings' cargo test -p takokit-cli tests::rvc --lib

      - name: Advanced RVC TUI regression tests
        shell: bash
        run: RUSTFLAGS='-D warnings' cargo test -p takokit-cli tui:: --lib

      - name: Complete workspace tests
        shell: bash
        run: RUSTFLAGS='-D warnings' cargo test --workspace

      - name: Release CLI and daemon binaries
        shell: bash
        run: RUSTFLAGS='-D warnings' cargo build --release --bin tako --bin takokit

      - name: GUI production build
        working-directory: apps/gui
        run: |
          npm ci
          npm run build

      - name: Repository quality checks
        run: python scripts/audit_file_sizes.py

      - name: Companion and library checks
        working-directory: site
        run: |
          npm install
          npm test
          npm run build

      - name: Re-run exact final HEAD critical gates
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
          cargo fmt --all -- --check
          RUSTFLAGS='-D warnings' cargo check --workspace
          RUSTFLAGS='-D warnings' cargo test -p takokit-cli daemon --lib
          RUSTFLAGS='-D warnings' cargo test -p takokit-models rvc_voice_service --lib
          RUSTFLAGS='-D warnings' cargo test -p takokit-models rvc_voice_service::package_security_tests --lib
          RUSTFLAGS='-D warnings' cargo test -p takokit-server rvc --lib
          RUSTFLAGS='-D warnings' cargo test -p takokit-cli tests::rvc --lib
          RUSTFLAGS='-D warnings' cargo test -p takokit-cli tui:: --lib
          git status --short

      - name: Push exact validated cleanup HEAD
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
          git push origin HEAD:slice/advanced-rvc-cloning
