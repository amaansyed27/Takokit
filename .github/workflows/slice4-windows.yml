name: Slice 4 Windows Distribution

on:
  workflow_dispatch:
  push:
    branches:
      - slice/windows-v0.0.1-release

permissions:
  contents: read

concurrency:
  group: slice4-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build and accept Windows distribution
    runs-on: windows-latest
    env:
      RUSTFLAGS: -D warnings
      TAKOKIT_BUILD_ID: slice4-${{ github.sha }}
    steps:
      - name: Check out exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            . -> target
            apps/desktop -> target

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/gui/package-lock.json

      - name: Validate release versions
        run: python scripts/check_release_version.py

      - name: Audit source file sizes
        run: python scripts/audit_file_sizes.py

      - name: Require canonical Rust formatting
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Core Rust formatting check failed.' }
          cargo fmt --manifest-path apps/desktop/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Desktop Rust formatting check failed.' }

      - name: Check locked core workspace
        run: cargo check --workspace --all-targets --locked

      - name: Run locked core workspace tests
        run: cargo test --workspace --locked

      - name: Install GUI dependencies
        working-directory: apps/gui
        run: npm ci

      - name: Audit production GUI dependencies
        working-directory: apps/gui
        run: npm audit --omit=dev --audit-level=high

      - name: Provision verified Inno Setup 7.1.0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe'
          $expectedSha256 = '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f'
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          $installRoot = Join-Path $env:RUNNER_TEMP 'Inno Setup 7.1.0'

          Invoke-WebRequest -Uri $url -OutFile $installer
          $actualSha256 = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "Inno Setup SHA-256 mismatch: expected $expectedSha256, got $actualSha256"
          }

          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid') {
            throw "Inno Setup Authenticode signature is not valid: $($signature.Status) $($signature.StatusMessage)"
          }
          if ($signature.SignerCertificate.Subject -notmatch 'Pyrsys B\.V\.') {
            throw "Unexpected Inno Setup signer: $($signature.SignerCertificate.Subject)"
          }

          $innoInstall = Start-Process -FilePath $installer -ArgumentList @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            '/CURRENTUSER',
            ('/DIR="' + $installRoot + '"')
          ) -Wait -PassThru
          if ($innoInstall.ExitCode -ne 0) {
            throw "Inno Setup installer failed with exit code $($innoInstall.ExitCode)"
          }
          $iscc = Join-Path $installRoot 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) {
            throw "Pinned Inno Setup compiler was not installed at $iscc"
          }
          $installRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Verified Inno Setup compiler: $iscc"

      - name: Build installer, portable package, signed manifests, and update fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/release/build-windows.ps1 -OutputRoot 'dist/windows-ci' -IncludeTestUpdateFixture

      - name: Run Windows installer and updater acceptance suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            & ./scripts/release/test-windows-distribution.ps1 -OutputRoot 'dist/windows-ci'
          } catch {
            $failure = ($_ | Out-String).Trim()
            New-Item -ItemType Directory -Force -Path 'dist/windows-ci' | Out-Null
            Set-Content -LiteralPath 'dist/windows-ci/acceptance-failure.txt' -Value $failure -Encoding utf8
            if ($env:GITHUB_STEP_SUMMARY) {
              "### Windows acceptance failure" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
              $failure | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            }
            throw
          }

      - name: Require complete acceptance report
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $reportPath = 'dist/windows-ci/acceptance-report.json'
          if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) {
            throw 'Windows acceptance report was not produced.'
          }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          $failed = @(
            $report.PSObject.Properties |
              Where-Object { $_.Value -is [bool] -and -not $_.Value } |
              ForEach-Object { $_.Name }
          )
          if ($failed.Count -gt 0) {
            throw "Windows acceptance report contains failed gates: $($failed -join ', ')"
          }
          Write-Host ($report | ConvertTo-Json -Depth 6)

      - name: Verify release build did not mutate tracked source
        shell: pwsh
        run: |
          $trackedChanges = @(git status --porcelain --untracked-files=no)
          if ($trackedChanges.Count -gt 0) {
            $trackedChanges | ForEach-Object { Write-Host $_ }
            throw 'Release build mutated tracked source files.'
          }

      - name: Remove internal staging trees before artifact upload
        if: always()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath 'dist/windows-ci/_staging') {
            Remove-Item -LiteralPath 'dist/windows-ci/_staging' -Recurse -Force
          }

      - name: Upload Windows distribution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: takokit-v0.0.1-windows-x86_64-${{ github.sha }}
          path: |
            dist/windows-ci/*.exe
            dist/windows-ci/*.zip
            dist/windows-ci/*.json
            dist/windows-ci/*.sig
            dist/windows-ci/*.txt
            dist/windows-ci/*.md
            dist/windows-ci/test-update/**
          if-no-files-found: warn
          retention-days: 14
