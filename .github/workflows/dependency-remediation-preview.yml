name: Dependency Remediation Preview

on:
  push:
    branches:
      - slice/linux-macos-distribution

permissions:
  contents: write

jobs:
  gui-lockfile:
    if: github.event.head_commit.message == 'Apply GUI lockfile security remediation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/gui/package-lock.json
      - name: Apply non-breaking audit fixes to lockfile only
        working-directory: apps/gui
        run: npm audit fix --package-lock-only
      - name: Verify remediated lockfile
        working-directory: apps/gui
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build
      - name: Commit exact npm-generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/gui/package-lock.json
          if git diff --cached --quiet; then
            echo 'No lockfile change required.'
            exit 0
          fi
          git commit -m 'Remediate GUI npm vulnerabilities'
          git push origin HEAD:${GITHUB_REF_NAME}
