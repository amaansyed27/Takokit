name: Dependency Remediation Preview

on:
  workflow_dispatch:
  push:
    branches:
      - slice/linux-macos-distribution

permissions:
  contents: read

jobs:
  gui-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/gui/package-lock.json
      - name: Apply non-breaking audit fixes to lockfile only
        working-directory: apps/gui
        run: npm audit fix --package-lock-only
      - name: Verify remediated lockfile
        working-directory: apps/gui
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build
      - name: Upload remediated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: gui-remediated-package-lock
          path: apps/gui/package-lock.json
          if-no-files-found: error
