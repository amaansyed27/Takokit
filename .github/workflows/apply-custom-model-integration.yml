        }) if sample == PathBuf::from("sample.wav")
            && name == "Amaan"
            && model == "qwen3-tts-1.7b-base"
    ));
}
''' + "\n"
              tests.write_text(source, encoding="utf-8")

          readme = Path("README.md")
