          )
          replace_once(
              "crates/takokit-models/src/runners/mod.rs",
              ") -> TakokitResult<SpeechResponse> {\n    match plan.runner.kind {",
              ") -> TakokitResult<SpeechResponse> {\n"
              "    validate_speech_request(&plan.model, &request)?;\n"
              "    match plan.runner.kind {",
          )

          args = Path("apps/cli/src/args.rs")
          source = args.read_text(encoding="utf-8")
          source = source.replace(
              "    Models,\n    Runners,\n    Library {",
              "    Models,\n"
              "    Runners,\n"
              "    CustomModel {\n"
              "        #[command(subcommand)]\n"
