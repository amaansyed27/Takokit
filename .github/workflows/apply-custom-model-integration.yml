          source = source.replace(
              "    if !model_prefetch_required(&model.id) {\n        return Ok(None);\n    }",
              "    let runtime_model = runtime_model_id(model);\n"
              "    if !model_prefetch_required(runtime_model) {\n"
              "        return Ok(None);\n"
              "    }",
              1,
          )
          source = source.replace(
              "        model_id: &model.id,\n        model_dir: &model_dir,",
              "        model_id: runtime_model,\n        model_dir: &model_dir,",
              1,
