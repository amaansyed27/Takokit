              "crates/takokit-package/src/lib.rs",
              "mod catalog;\nmod error;",
              "mod catalog;\nmod custom_model;\nmod error;",
          )
          replace_once(
              "crates/takokit-package/src/lib.rs",
              "mod transaction;\n\npub use catalog::*;",
              "mod transaction;\nmod voice_contract;\n\npub use catalog::*;\npub use custom_model::*;",
          )
          replace_once(
              "crates/takokit-package/src/lib.rs",
              "pub use runtime_python_specs::adapter_for_model;",
              "pub use runtime_python_specs::{adapter_for_model, runtime_model_id};",
          )
          replace_once(
              "crates/takokit-package/src/lib.rs",
              "pub use runtime_uv::{bootstrap_uv, find_uv};",
              "pub use runtime_uv::{bootstrap_uv, find_uv};\npub use voice_contract::*;",
          )

          replace_once(
              "crates/takokit-package/src/error.rs",
