              "    },\n"
              "    Voice {\n"
              "        #[command(subcommand)]\n"
              "        command: VoiceCommand,\n"
              "    },\n"
              "    Library {",
              1,
          )
          source = source.replace(
              "#[derive(Debug, Subcommand)]\npub(crate) enum RunnerCommand {",
              "#[derive(Debug, Subcommand)]\n"
              "pub(crate) enum CustomModelCommand {\n"
