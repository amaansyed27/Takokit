              "}\n",
              "pub fn adapter_for_model(model_id: &str) -> Option<&'static str> {\n"
              "    ADAPTER_SPECS\n"
              "        .iter()\n"
              "        .find(|spec| spec.model_family == model_id)\n"
              "        .map(|spec| spec.id)\n"
              "}\n\n"
              "pub fn runtime_model_id(model: &ModelManifest) -> &str {\n"
              "    if adapter_for_model(&model.id).is_some() {\n"
              "        return &model.id;\n"
              "    }\n"
              "    if let (Some(required), Some(base_adapter)) = (\n"
              "        model.required_adapter.as_deref(),\n"
              "        adapter_for_model(&model.family),\n"
              "    ) {\n"
              "        if required == base_adapter {\n"
              "            return &model.family;\n"
              "        }\n"
              "    }\n"
              "    &model.id\n"
              "}\n",
          )

          prefetch = Path("crates/takokit-package/src/runtime_python/prefetch.rs")
          source = prefetch.read_text(encoding="utf-8")
          source = source.replace(
              "    runtime_python_specs::model_prefetch_required,",
              "    runtime_python_specs::{model_prefetch_required, runtime_model_id},",
