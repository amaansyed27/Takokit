              '    #[error("invalid custom model: {0}")]\n'
              '    InvalidCustomModel(String),\n'
              '    #[error("artifact URL missing for {model}: {artifact}")]\n',
          )
          replace_once(
              "crates/takokit-package/src/error.rs",
              "            error @ PackageError::ArtifactUrlMissing { .. } => TakokitError::Resolution {",
              "            PackageError::InvalidCustomModel(message) => {\n"
              "                TakokitError::InvalidRequest(format!(\"invalid custom model: {message}\"))\n"
              "            }\n"
              "            error @ PackageError::ArtifactUrlMissing { .. } => TakokitError::Resolution {",
          )

          registry = Path("crates/takokit-package/src/registry.rs")
          source = registry.read_text(encoding="utf-8")
          replacements = [
              (
                  "    remote_url: Option<String>,\n}",
                  "    remote_url: Option<String>,\n    custom_models_dir: Option<PathBuf>,\n}",
