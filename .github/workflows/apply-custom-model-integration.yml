#[test]
fn cli_parses_custom_model_and_voice_commands() {
    let custom = Cli::try_parse_from(["takokit", "custom-model", "add", "custom.toml"])
        .expect("custom model add");
    let voice = Cli::try_parse_from([
        "takokit",
