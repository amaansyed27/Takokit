name: Slice 2 finalizer

on:
  push:
    branches:
      - slice/interactive-stabilization

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: slice/interactive-stabilization
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Split clone submit helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/cli/src/tui/input/forms.rs')
          source = path.read_text(encoding='utf-8')
          start = 'pub(super) fn submit_clone'
          end = '\n#[cfg(test)]'
          if source.count(start) != 1 or source.count(end) != 1:
              raise SystemExit('unexpected forms.rs structure')
          before, rest = source.split(start, 1)
          block, after = rest.split(end, 1)
          block = start + block
          target = Path('apps/cli/src/tui/input/forms/clone_submit.rs')
          target.write_text('use super::*;\n\n' + block.rstrip() + '\n', encoding='utf-8')
          source = before + end + after
          marker = 'mod convert_submit;\nuse convert_submit::submit_convert;'
          replacement = 'mod clone_submit;\nmod convert_submit;\nuse clone_submit::submit_clone;\nuse convert_submit::submit_convert;'
          if marker not in source:
              raise SystemExit('submit module marker missing')
          path.write_text(source.replace(marker, replacement, 1), encoding='utf-8')

          tests = Path('apps/cli/src/tui/input/forms/tests.rs')
          text = tests.read_text(encoding='utf-8')
          tests.write_text(text.lstrip('\n'), encoding='utf-8')
          PY
      - run: cargo fmt --all
      - run: cargo fmt --all -- --check
      - run: python scripts/audit_file_sizes.py
      - name: Commit final split
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Split clone submit helper from TUI form handlers"
          git push origin HEAD:slice/interactive-stabilization
