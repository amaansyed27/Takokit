name: Slice 2 finalizer

on:
  push:
    branches:
      - slice/interactive-stabilization

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: slice/interactive-stabilization
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: python scripts/slice2_split_form_tests.py
      - run: cargo fmt --all
      - name: Commit split
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Split TUI form tests from input handlers"
          git push origin HEAD:slice/interactive-stabilization
