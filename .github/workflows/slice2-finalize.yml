name: Slice 2 finalizer

on:
  push:
    branches:
      - slice/interactive-stabilization

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: slice/interactive-stabilization
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Fix submit helper visibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/cli/src/tui/input/forms.rs')
          source = path.read_text(encoding='utf-8')
          source = source.replace('use clone_submit::submit_clone;', 'pub(super) use clone_submit::submit_clone;', 1)
          source = source.replace('use convert_submit::submit_convert;', 'pub(super) use convert_submit::submit_convert;', 1)
          path.write_text(source, encoding='utf-8')
          PY
      - run: cargo fmt --all -- --check
      - run: python scripts/audit_file_sizes.py
      - run: cargo check --workspace
      - name: Commit visibility fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expose split TUI submit helpers to input router"
          git push origin HEAD:slice/interactive-stabilization
