name: Slice 4 one-shot layout fix

on:
  push:
    branches:
      - slice/windows-v0.0.1-release
    paths:
      - .github/workflows/slice4-layout-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: slice/windows-v0.0.1-release
          fetch-depth: 0
      - name: Separate desktop shell from CLI alias
        shell: python
        run: |
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}: {old!r}")
              p.write_text(text.replace(old, new, count), encoding="utf-8", newline="\n")

          replace(
              "scripts/release/build-windows.ps1",
              "Copy-Item 'apps\\desktop\\target\\release\\Takokit.exe' (Join-Path $BaseTree 'bin\\Takokit.exe')",
              "Copy-Item 'apps\\desktop\\target\\release\\Takokit.exe' (Join-Path $BaseTree 'Takokit.exe')",
          )
          replace(
              "packaging/windows/Takokit.iss",
              "UninstallDisplayIcon={app}\\bin\\Takokit.exe",
              "UninstallDisplayIcon={app}\\Takokit.exe",
          )
          replace(
              "packaging/windows/Takokit.iss",
              'Name: "{group}\\Takokit"; Filename: "{app}\\bin\\Takokit.exe";',
              'Name: "{group}\\Takokit"; Filename: "{app}\\Takokit.exe";',
          )
          replace(
              "apps/cli/src/distribution.rs",
              'application_root()?.join("bin").join("Takokit.exe")',
              'application_root()?.join("Takokit.exe")',
          )
          replace(
              "apps/desktop/src/main.rs",
              '    let bin_dir = env::current_exe()?\n        .parent()\n        .map(PathBuf::from)\n        .ok_or("desktop executable has no parent directory")?;\n    let tako = bin_dir.join("tako.exe");',
              '    let app_root = env::current_exe()?\n        .parent()\n        .map(PathBuf::from)\n        .ok_or("desktop executable has no parent directory")?;\n    let bin_dir = app_root.join("bin");\n    let tako = bin_dir.join("tako.exe");',
          )
          replace(
              "apps/cli/src/takokit_updater_support.rs",
              '        "bin/Takokit.exe",',
              '        "Takokit.exe",',
          )
          replace(
              "scripts/release/test-windows-distribution.ps1",
              "    Assert-True (Test-Path -LiteralPath (Join-Path $InstalledBin 'Takokit.exe') -PathType Leaf) 'Installer did not install the desktop shell.'",
              "    Assert-True (Test-Path -LiteralPath (Join-Path $InstallRoot 'Takokit.exe') -PathType Leaf) 'Installer did not install the desktop shell.'",
          )
          replace(
              "scripts/release/test-windows-distribution.ps1",
              "    $TuiShortcutPath = Join-Path $StartMenu 'Takokit (TUI).lnk'\n    Assert-True (Test-Path -LiteralPath $TuiShortcutPath -PathType Leaf) \"TUI Start Menu shortcut is missing: $TuiShortcutPath\"",
              "    $GuiShortcutPath = Join-Path $StartMenu 'Takokit.lnk'\n    $TuiShortcutPath = Join-Path $StartMenu 'Takokit (TUI).lnk'\n    Assert-True (Test-Path -LiteralPath $GuiShortcutPath -PathType Leaf) \"GUI Start Menu shortcut is missing: $GuiShortcutPath\"\n    Assert-True (Test-Path -LiteralPath $TuiShortcutPath -PathType Leaf) \"TUI Start Menu shortcut is missing: $TuiShortcutPath\"",
          )
          replace(
              "scripts/release/test-windows-distribution.ps1",
              "    $TuiShortcut = $Shell.CreateShortcut($TuiShortcutPath)\n    $ExpectedDocuments = [Environment]::GetFolderPath('MyDocuments')",
              "    $GuiShortcut = $Shell.CreateShortcut($GuiShortcutPath)\n    $TuiShortcut = $Shell.CreateShortcut($TuiShortcutPath)\n    Assert-True ([string]::Equals($GuiShortcut.TargetPath, (Join-Path $InstallRoot 'Takokit.exe'), [StringComparison]::OrdinalIgnoreCase)) 'GUI shortcut does not target the installed desktop shell.'\n    $ExpectedDocuments = [Environment]::GetFolderPath('MyDocuments')",
          )

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt
      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt -- --check
          cargo fmt --manifest-path apps/desktop/Cargo.toml -- --check
          python scripts/audit_file_sizes.py
          git diff --check
      - name: Commit layout fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/release/build-windows.ps1 packaging/windows/Takokit.iss apps/cli/src/distribution.rs apps/desktop/src/main.rs apps/cli/src/takokit_updater_support.rs scripts/release/test-windows-distribution.ps1
          git diff --cached --exit-code && { echo "Patch produced no changes"; exit 1; } || true
          git commit -m "Separate Windows desktop shell from CLI alias"
          git push origin HEAD:slice/windows-v0.0.1-release
