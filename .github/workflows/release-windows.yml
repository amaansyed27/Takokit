name: Publish Windows Release

on:
  push:
    tags:
      - v0.2.0

permissions:
  contents: write

concurrency:
  group: publish-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  accept:
    uses: ./.github/workflows/slice4-windows.yml
    with:
      production_release: true
    secrets:
      TAKOKIT_RELEASE_SIGNING_KEY_HEX: ${{ secrets.TAKOKIT_RELEASE_SIGNING_KEY_HEX }}
      TAKOKIT_RELEASE_PUBLIC_KEY_HEX: ${{ secrets.TAKOKIT_RELEASE_PUBLIC_KEY_HEX }}

  publish:
    name: Publish deliberate GitHub Release
    needs: accept
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the release tag to be merged into main
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ github.ref_name }}' -ne 'v0.2.0') { throw 'Only v0.2.0 is supported by this release workflow.' }
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'The release tag commit is not contained in origin/main.' }
          python scripts/check_release_version.py

      - name: Download accepted Windows artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: takokit-v0.2.0-windows-x86_64-${{ github.sha }}
          path: release-assets

      - name: Require canonical production release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            'Takokit-v0.2.0-windows-x86_64-installer.exe',
            'Takokit-v0.2.0-windows-x86_64.zip',
            'Takokit-v0.2.0-windows-x86_64-update.zip',
            'SHA256SUMS.txt',
            'release-manifest.json',
            'release-manifest.sig',
            'RELEASE_NOTES-v0.2.0.md',
            'build-provenance.json',
            'authenticode-status.json'
          )
          foreach ($name in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path 'release-assets' $name) -PathType Leaf)) {
              throw "Missing canonical release asset: $name"
            }
          }
          $manifest = Get-Content -LiteralPath 'release-assets/release-manifest.json' -Raw | ConvertFrom-Json
          if ($manifest.version -ne '0.2.0' -or $manifest.channel -ne 'stable' -or $manifest.test_fixture -ne $false) {
            throw 'Release manifest is not the stable Takokit v0.2.0 manifest.'
          }
          if ($manifest.signing_key_id -ne 'takokit-release-v1') {
            throw "Unexpected production signing identity: $($manifest.signing_key_id)"
          }

      - name: Publish Takokit v0.2.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release create '${{ github.ref_name }}' `
            --repo '${{ github.repository }}' `
            --verify-tag `
            --title 'Takokit v0.2.0' `
            --notes-file 'release-assets/RELEASE_NOTES-v0.2.0.md' `
            'release-assets/Takokit-v0.2.0-windows-x86_64-installer.exe' `
            'release-assets/Takokit-v0.2.0-windows-x86_64.zip' `
            'release-assets/Takokit-v0.2.0-windows-x86_64-update.zip' `
            'release-assets/SHA256SUMS.txt' `
            'release-assets/release-manifest.json' `
            'release-assets/release-manifest.sig' `
            'release-assets/RELEASE_NOTES-v0.2.0.md' `
            'release-assets/build-provenance.json' `
            'release-assets/authenticode-status.json'
