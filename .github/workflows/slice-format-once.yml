name: Slice format once

on:
  push:
    branches:
      - slice/interactive-stabilization

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out stabilization branch
        uses: actions/checkout@v4
        with:
          ref: slice/interactive-stabilization
          fetch-depth: 0

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format and self-remove
        shell: bash
        run: |
          cargo fmt --all
          rm .github/workflows/slice-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format interactive stabilization changes"
          git push origin HEAD:slice/interactive-stabilization
