name: P1 Package Test Fixer

on:
  push:
    branches:
      - fix/p1-stability-hardening

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply package test fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          install = Path("crates/takokit-package/src/install_support.rs")
          source = install.read_text()
          old = "    File::open(destination)?.sync_all()?;"
          new = "    OpenOptions::new().write(true).open(destination)?.sync_all()?;"
          if source.count(old) != 1:
              raise SystemExit("copy_synced destination flush target did not match exactly once")
          install.write_text(source.replace(old, new, 1))

          tests = Path("crates/takokit-package/src/tests/artifact_install.rs")
          source = tests.read_text()
          old = "    let leftovers = std::fs::read_dir(downloads)\n        .map(|entries| entries.count())\n        .unwrap_or(0);\n\n    assert_eq!(leftovers, 0);"
          new = "    let partials = std::fs::read_dir(downloads)\n        .map(|entries| {\n            entries\n                .flatten()\n                .filter(|entry| entry.path().extension().is_some_and(|ext| ext == \"part\"))\n                .count()\n        })\n        .unwrap_or(0);\n\n    assert_eq!(partials, 0);"
          if source.count(old) != 1:
              raise SystemExit("checksum temporary-download assertion target did not match exactly once")
          tests.write_text(source.replace(old, new, 1))
          PY
          cargo fmt --all

      - name: Verify package tests on Linux
        env:
          RUSTFLAGS: -D warnings
        run: cargo test -p takokit-package --lib

      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No package test changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/takokit-package/src/install_support.rs \
            crates/takokit-package/src/tests/artifact_install.rs
          git commit -m "fix(package): harden Windows durable copies and download tests"
          git push origin HEAD:fix/p1-stability-hardening
