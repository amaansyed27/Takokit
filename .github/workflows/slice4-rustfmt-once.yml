name: Slice 4 Canonical Rustfmt Once

on:
  push:
    branches:
      - slice/windows-v0.0.1-release

permissions:
  contents: write

concurrency:
  group: slice4-rustfmt-once
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: slice/windows-v0.0.1-release
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt
      - name: Canonicalize Rust source
        shell: pwsh
        run: |
          cargo fmt --all
          cargo fmt --manifest-path apps/desktop/Cargo.toml
          if (-not (git status --porcelain -- '*.rs')) {
            Write-Host 'Rust source is already canonical.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.rs'
          git commit -m 'Canonicalize Slice 4 Rust formatting'
          git push origin HEAD:slice/windows-v0.0.1-release
