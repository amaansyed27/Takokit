name: RVC GUI wire once
on:
  push:
    branches: [slice/advanced-rvc-cloning]
    paths:
      - .github/workflows/rvc-gui-wire-once.yml
      - .github/scripts/rvc-gui-wire.py
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/gui/package-lock.json
      - name: Apply Voice Studio wiring
        run: python .github/scripts/rvc-gui-wire.py
      - name: Validate GUI
        working-directory: apps/gui
        run: |
          npm ci
          npm run build
      - name: Commit wiring
        run: |
          git rm .github/workflows/rvc-gui-wire-once.yml .github/scripts/rvc-gui-wire.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(gui): finish Advanced RVC Voice Studio integration"
          git push origin HEAD:slice/advanced-rvc-cloning
