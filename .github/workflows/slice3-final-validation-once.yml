name: Slice 3 final validation once
on:
  push:
    branches: [slice/advanced-rvc-cloning]
    paths:
      - .github/workflows/slice3-final-validation-once.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore Slice 2 daemon and warning cleanup
        shell: bash
        run: |
          set -euxo pipefail
          git checkout 147e85e28296f5e172ae5184dc390d5a3030b739 -- apps/cli/src/daemon.rs
          python -c 'from pathlib import Path; p=Path("apps/cli/src/daemon.rs"); s=p.read_text(encoding="utf-8"); old="    port_is_occupied, preferred_daemon_executable, startup_lock, takokit_health_responds,\n    verify_identity,\n};"; new="    port_is_occupied, startup_lock, verify_identity,\n};\n#[cfg(test)]\nuse runtime::{preferred_daemon_executable, takokit_health_responds};"; assert old in s; p.write_text(s.replace(old,new,1),encoding="utf-8")'
          python -c 'from pathlib import Path; p=Path("apps/cli/src/tui/job.rs"); s=p.read_text(encoding="utf-8"); old="    path::{Path, PathBuf},\n"; new="    path::PathBuf,\n"; assert old in s; p.write_text(s.replace(old,new,1),encoding="utf-8")'
          cargo fmt --all
      - name: Create exact cleanup commit
        shell: bash
        run: |
          set -euxo pipefail
          git rm -f .github/workflows/slice3-final-validation-once.yml
          git rm -f .github/workflows/slice3-repair-finalize-once.yml
          test ! -e .github/workflows/rvc-regression-wire-once.yml
          test ! -e .github/scripts/rvc-test-wire.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/cli/src/daemon.rs apps/cli/src/tui/job.rs
          git commit -m "fix(slice3): restore daemon and finalize validation cleanup"
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Rust workspace warnings as errors
        shell: bash
        run: RUSTFLAGS='-D warnings' cargo check --workspace
      - name: Daemon and build freshness regression tests
        shell: bash
        run: RUSTFLAGS='-D warnings' cargo test -p takokit-cli daemon --lib
      - name: Advanced RVC service and managed conversion tests
        shell: bash
        run: RUSTFLAGS='-D warnings' cargo test -p takokit-models rvc_voice_service --lib
      - name: Takovoice signing and security tests
        shell: bash
        run: RUSTFLAGS='-D warnings' cargo test -p takokit-models rvc_voice_service::package_security_tests --lib
      - name: Advanced RVC API tests
        shell: bash
        run: RUSTFLAGS='-D warnings' cargo test -p takokit-server rvc --lib
      - name: Advanced RVC CLI tests
        shell: bash
        run: RUSTFLAGS='-D warnings' cargo test -p takokit-cli tests::rvc --lib
      - name: Advanced RVC TUI tests
        shell: bash
        run: |
          RUSTFLAGS='-D warnings' cargo test -p takokit-cli tui:: --lib
      - name: Complete workspace tests
        shell: bash
        run: RUSTFLAGS='-D warnings' cargo test --workspace
      - name: Release binaries
        shell: bash
        run: RUSTFLAGS='-D warnings' cargo build --release --bin tako --bin takokit
      - name: GUI production build
        working-directory: apps/gui
        run: |
          npm ci
          npm run build
      - name: Repository quality checks
        run: python scripts/audit_file_sizes.py
      - name: Companion and library checks
        working-directory: site
        run: |
          npm install
          npm test
          npm run build
      - name: Discard validation-only lockfile normalization
        shell: bash
        run: git checkout -- site/package-lock.json
      - name: Verify exact final commit stayed clean
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
          cargo fmt --all -- --check
          RUSTFLAGS='-D warnings' cargo check --workspace
          RUSTFLAGS='-D warnings' cargo test -p takokit-cli daemon --lib
          RUSTFLAGS='-D warnings' cargo test -p takokit-models rvc_voice_service --lib
          RUSTFLAGS='-D warnings' cargo test -p takokit-models rvc_voice_service::package_security_tests --lib
          RUSTFLAGS='-D warnings' cargo test -p takokit-server rvc --lib
          RUSTFLAGS='-D warnings' cargo test -p takokit-cli tests::rvc --lib
          RUSTFLAGS='-D warnings' cargo test -p takokit-cli tui:: --lib
          git diff --exit-code
      - name: Push exact validated cleanup HEAD
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
          git push origin HEAD:slice/advanced-rvc-cloning
