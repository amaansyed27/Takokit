name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - slice/interactive-stabilization
      - slice/advanced-rvc-cloning
      - slice/linux-macos-distribution

permissions:
  contents: read
  statuses: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Repository quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Audit source file sizes
        shell: bash
        run: |
          set -o pipefail
          python scripts/audit_file_sizes.py 2>&1 | tee file-size-audit.txt

      - name: Upload file-size audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: file-size-audit
          path: file-size-audit.txt
          if-no-files-found: error

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: -D warnings
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check API namespace and OpenAPI contract
        run: python scripts/check_api_contract.py

      - name: Check workspace (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -o pipefail
          cargo check --workspace 2>&1 | tee cargo-check.log

      - name: Check workspace (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo check --workspace 2>&1 | Tee-Object -FilePath cargo-check-windows.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload cargo check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-check-${{ matrix.os }}
          path: |
            cargo-check.log
            cargo-check-windows.log
          if-no-files-found: ignore

      - name: Test workspace (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee cargo-test.log

      - name: Test workspace (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo test --workspace 2>&1 | Tee-Object -FilePath cargo-test-windows.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build release binaries
        run: cargo build --release --bin tako --bin takokit-server

      - name: Pull RVC in clean managed home (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.24
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:UV = (Get-Command uv.exe -ErrorAction Stop).Source
          & $env:UV --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:TAKOKIT_HOME = Join-Path $env:RUNNER_TEMP "takokit-rvc-pull-smoke"
          $Tako = Join-Path $PWD "target\release\tako.exe"
          & $Tako pull rvc
          if ($LASTEXITCODE -ne 0) {
            $Log = Join-Path $env:TAKOKIT_HOME "runners\python-managed\adapters\rvc\install.log"
            if (Test-Path $Log) { Get-Content $Log -Tail 300 }
            $TrainingLog = Join-Path $env:TAKOKIT_HOME "runners\python-managed\adapters\rvc_training\install.log"
            if (Test-Path $TrainingLog) { Get-Content $TrainingLog -Tail 300 }
            exit $LASTEXITCODE
          }
          $Adapter = Join-Path $env:TAKOKIT_HOME "runners\python-managed\adapters\rvc"
          $Python = Join-Path $Adapter "venv\Scripts\python.exe"
          $Code = 'import importlib.util,pathlib,sys; a=pathlib.Path(sys.argv[1]); s=importlib.util.spec_from_file_location("takokit_rvc",a/"rvc.py"); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); m.install_fairseq_import_stub(); sys.path.insert(0,str(a/"source")); from rvc.modules.vc.modules import VC; assert VC is not None; print("managed RVC converter import: ok")'
          & $Python -c $Code $Adapter
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $Log = Join-Path $Adapter "install.log"
          $Text = Get-Content $Log -Raw
          if ($Text -match "Building.*fairseq|fairseq.*cpp_extension|fairseq/clib") {
            throw "RVC pull attempted to compile fairseq"
          }

      - name: Prepare real RVC dataset in clean managed home (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:TAKOKIT_HOME = Join-Path $env:RUNNER_TEMP "takokit-rvc-pull-smoke"
          $Tako = Join-Path $PWD "target\release\tako.exe"
          $Sample = Join-Path $env:RUNNER_TEMP "rvc-prepare-smoke.wav"
          @'
          import math
          import struct
          import sys
          import wave

          path = sys.argv[1]
          sample_rate = 16000
          seconds = 8
          with wave.open(path, "wb") as wav:
              wav.setnchannels(1)
              wav.setsampwidth(2)
              wav.setframerate(sample_rate)
              frames = bytearray()
              for i in range(sample_rate * seconds):
                  t = i / sample_rate
                  value = 0.22 * math.sin(2.0 * math.pi * (180.0 + 35.0 * math.sin(2.0 * math.pi * 0.7 * t)) * t)
                  frames.extend(struct.pack("<h", int(max(-1.0, min(1.0, value)) * 32767)))
              wav.writeframes(frames)
          '@ | python - $Sample
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $Tako --direct voice rvc create --name "CI RVC Prepare Smoke" --consent
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $VoiceRoot = Join-Path $env:TAKOKIT_HOME "voices\rvc"
          $Voice = (Get-ChildItem $VoiceRoot -Directory | Sort-Object LastWriteTime -Descending | Select-Object -First 1).Name
          if (-not $Voice) { throw "RVC prepare smoke did not create a voice project" }

          & $Tako --direct voice rvc samples $Voice add $Sample
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $Tako --direct voice rvc inspect $Voice
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $Tako --direct voice rvc preflight $Voice --preset custom --epochs 1 --batch-size 1 --save-every-epochs 1 --device cpu --precision fp32
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $Tako --direct voice rvc prepare $Voice --preset custom --epochs 1 --batch-size 1 --save-every-epochs 1 --device cpu --precision fp32
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $VoiceDir = Join-Path $VoiceRoot $Voice
          $Deadline = (Get-Date).AddMinutes(20)
          $Succeeded = $false
          while ((Get-Date) -lt $Deadline) {
            $JobFile = Get-ChildItem (Join-Path $VoiceDir "jobs") -Filter "*.json" |
              Where-Object { $_.BaseName -match '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$' } |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1
            if ($JobFile) {
              $Job = Get-Content $JobFile.FullName -Raw | ConvertFrom-Json
              Write-Host "RVC prepare status=$($Job.status) stage=$($Job.stage)"
              if ($Job.status -eq "succeeded") {
                if ($Job.stage -ne "ready_to_train") {
                  throw "RVC preparation succeeded with unexpected terminal stage: $($Job.stage)"
                }
                $Succeeded = $true
                break
              }
              if ($Job.status -in @("failed", "stale", "cancelled")) {
                if ($Job.log_path -and (Test-Path $Job.log_path)) { Get-Content $Job.log_path -Tail 300 }
                throw "RVC preparation ended as $($Job.status): $($Job.failure)"
              }
            }
            Start-Sleep -Seconds 5
          }
          if (-not $Succeeded) { throw "Timed out waiting for real RVC dataset preparation" }

          $Experiment = Join-Path $VoiceDir "dataset\experiment"
          $FileList = Join-Path $Experiment "filelist.txt"
          $ConfigPath = Join-Path $Experiment "config.json"
          if (-not (Test-Path $FileList)) { throw "RVC preparation produced no filelist.txt" }
          if (-not (Test-Path $ConfigPath)) { throw "RVC preparation produced no config.json" }
          $Config = Get-Content $ConfigPath -Raw | ConvertFrom-Json
          if ($Config.data.sampling_rate -ne 40000) {
            throw "RVC preparation copied the wrong 40 kHz topology config"
          }
          if ((Get-Content $FileList | Where-Object { $_.Trim() }).Count -lt 1) {
            throw "RVC preparation produced an empty training file list"
          }
          $LatestLog = Get-ChildItem (Join-Path $VoiceDir "logs") -Filter "*.log" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if ($LatestLog) { Get-Content $LatestLog.FullName -Tail 120 }

      - name: Upload Rust test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-test-${{ matrix.os }}
          path: |
            cargo-test.log
            cargo-test-windows.log
          if-no-files-found: ignore

  gui:
    name: GUI build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/gui/package-lock.json

      - name: Install GUI dependencies
        run: npm ci
        working-directory: apps/gui

      - name: Build GUI
        shell: bash
        working-directory: apps/gui
        run: |
          set -o pipefail
          npm run build 2>&1 | tee gui-build.log

      - name: Upload GUI build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-build-log
          path: apps/gui/gui-build.log
          if-no-files-found: ignore

  site:
    name: Library site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install site dependencies
        working-directory: site
        run: npm install

      - name: Validate registry-backed site
        working-directory: site
        run: npm test

      - name: Build library site
        working-directory: site
        run: npm run build

  publish-status:
    name: Publish aggregate status
    if: always() && github.event_name == 'push'
    needs:
      - quality
      - rust
      - gui
      - site
    runs-on: ubuntu-latest
    steps:
      - name: Publish classic commit status
        uses: actions/github-script@v7
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          GUI_RESULT: ${{ needs.gui.result }}
          SITE_RESULT: ${{ needs.site.result }}
        with:
          script: |
            const results = {
              quality: process.env.QUALITY_RESULT,
              rust: process.env.RUST_RESULT,
              gui: process.env.GUI_RESULT,
              site: process.env.SITE_RESULT,
            };
            const passed = Object.values(results).every((result) => result === 'success');
            const description = Object.entries(results)
              .map(([name, result]) => `${name}=${result}`)
              .join(', ')
              .slice(0, 140);
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'takokit/ci',
              description,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
