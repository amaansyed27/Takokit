name: Slice 4 Canonical Bootstrap

on:
  push:
    branches:
      - slice/windows-v0.0.1-release

permissions:
  contents: write

concurrency:
  group: slice4-canonical-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonicalize:
    name: Canonicalize Rust and desktop lockfile
    runs-on: windows-latest
    steps:
      - name: Check out exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt

      - name: Canonically format Rust
        run: cargo fmt --all

      - name: Generate desktop Cargo lockfile
        run: cargo generate-lockfile --manifest-path apps/desktop/Cargo.toml

      - name: Commit canonical generated outputs when needed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- ':(glob)**/*.rs' Cargo.toml Cargo.lock apps/desktop/Cargo.toml apps/desktop/Cargo.lock
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Canonical Rust source and desktop lockfile are already committed.'
            exit 0
          }
          if ($LASTEXITCODE -ne 1) {
            throw "git diff --cached --quiet failed with exit code $LASTEXITCODE"
          }
          git commit -m 'Commit canonical Rust formatting and desktop lockfile'
          if ($LASTEXITCODE -ne 0) { throw 'git commit failed' }
          git push origin HEAD:slice/windows-v0.0.1-release
          if ($LASTEXITCODE -ne 0) { throw 'git push failed' }
