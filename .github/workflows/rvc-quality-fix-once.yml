name: RVC quality fix once
on:
  push:
    branches: [slice/advanced-rvc-cloning]
    paths:
      - .github/workflows/rvc-quality-fix-once.yml
      - .github/scripts/rvc-quality-fix.py
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/gui/package-lock.json
      - name: Apply refactors and format
        run: |
          python .github/scripts/rvc-quality-fix.py
          cargo fmt --all
      - name: Check package security tests
        run: cargo test -p takokit-models rvc_voice_service::package_security_tests --lib
      - name: Check GUI
        working-directory: apps/gui
        run: |
          npm ci
          npm run build
      - name: Check repository quality
        run: python scripts/audit_file_sizes.py
      - name: Commit refactors
        run: |
          git rm .github/workflows/rvc-quality-fix-once.yml .github/scripts/rvc-quality-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(slice3): satisfy quality limits and format package tests"
          git push origin HEAD:slice/advanced-rvc-cloning
