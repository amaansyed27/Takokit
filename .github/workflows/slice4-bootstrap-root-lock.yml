name: Slice 4 Root Lock Bootstrap

on:
  push:
    branches:
      - slice/windows-v0.0.1-release

permissions:
  contents: write

concurrency:
  group: slice4-root-lock-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock:
    name: Regenerate root Cargo lockfile
    runs-on: windows-latest
    steps:
      - name: Check out exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0

      - name: Generate root Cargo lockfile
        run: cargo generate-lockfile

      - name: Commit root lockfile when needed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Cargo.lock
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Root Cargo.lock is already current.'
            exit 0
          }
          if ($LASTEXITCODE -ne 1) { throw "git diff failed with exit code $LASTEXITCODE" }
          git commit -m 'Refresh root Cargo lockfile for Slice 4'
          if ($LASTEXITCODE -ne 0) { throw 'git commit failed' }
          git push origin HEAD:slice/windows-v0.0.1-release
          if ($LASTEXITCODE -ne 0) { throw 'git push failed' }
