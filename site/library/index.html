<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Browse Takokit's curated local voice model families and pinned releases." />
    <meta name="theme-color" content="#071522" />
    <title>Model Library · Takokit</title>
    <link rel="icon" type="image/svg+xml" href="/assets/brand/takokit-mark.svg" />
    <link rel="stylesheet" href="/assets/base.css" />
    <link rel="stylesheet" href="/assets/pages.css" />
    <link rel="stylesheet" href="/assets/detail.css" />
    <link rel="stylesheet" href="/assets/responsive.css" />
  </head>
  <body data-page="library">
    <div data-site-header></div>
    <main>
      <header class="page-hero">
        <div class="shell">
          <p class="eyebrow">Curated and pinned</p>
          <h1>Voice model library.</h1>
          <p class="lead">
            Search speech synthesis, transcription, cloning, conversion, and audio-language
            families. Every visible release maps to a validated Takokit manifest.
          </p>
        </div>
      </header>
      <div class="shell library-layout">
        <aside class="filter-panel" aria-label="Model filters">
          <div class="filter-group">
            <strong>Capability</strong>
            <button class="filter-button is-active" data-filter="">All models</button>
            <button class="filter-button" data-filter="tts">Text to speech</button>
            <button class="filter-button" data-filter="stt">Speech to text</button>
            <button class="filter-button" data-filter="voice-cloning">Voice cloning</button>
            <button class="filter-button" data-filter="voice-conversion">Conversion</button>
            <button class="filter-button" data-filter="voice-training">Voice training</button>
            <button class="filter-button" data-filter="live-audio">Live audio</button>
          </div>
          <div class="filter-group">
            <strong>Runtime</strong>
            <button class="filter-button" data-runner="">Any runner</button>
            <button class="filter-button" data-runner="python-managed">Python managed</button>
            <button class="filter-button" data-runner="whispercpp">Whisper.cpp</button>
            <button class="filter-button" data-runner="onnx">ONNX</button>
          </div>
        </aside>
        <section>
          <div class="search-bar">
            <input id="library-search" type="search" placeholder="Search model, tag, task, runner…" autofocus />
            <span>⌘ /</span>
          </div>
          <p class="result-line" id="result-line">Loading registry…</p>
          <div class="model-list library-results" id="library-results">
            <div class="loading-row"></div>
            <div class="loading-row"></div>
            <div class="loading-row"></div>
            <div class="loading-row"></div>
          </div>
        </section>
      </div>
    </main>
    <div data-site-footer></div>
    <script type="module" src="/assets/app.js"></script>
  </body>
</html>
